server:
  port: 8080
spring:
#  messages:
#    basename: messages
#    encoding: UTF-8
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME:localhost}:${DB_PORT:5437}/${DB_SCHEMA:postgres}
    password: ${DB_PASSWORD:1234}
    username: ${DB_USERNAME:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-${PROFILE:test}.yaml
