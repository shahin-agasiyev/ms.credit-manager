databaseChangeLog:
  - changeSet:
      id: 1
      author: agasiyev
      changes:
        - createTable:
            tableName: customer
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: pin
                  type: varchar
              #                  constraints:
              #                    nullable: false
              - column:
                  name: full_name
                  type: varchar
              #                  constraints:
              #                    nullable: false
              - column:
                  name: phone_number
                  type: varchar
                  constraints:
              #                    nullable: false
              #                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
#                    updatable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP