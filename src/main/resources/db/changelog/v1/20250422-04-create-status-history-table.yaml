databaseChangeLog:
  - changeSet:
      id: 1
      author: agasiyev
      changes:
        - createTable:
            tableName: status_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: varchar
              #                  constraints:
              #                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
#                    updatable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: credit_id
                  type: bigint
                  constraints:
                    nullable: false