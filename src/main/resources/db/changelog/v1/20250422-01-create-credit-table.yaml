databaseChangeLog:
  - changeSet:
      id: 1
      author: agasiyev
      changes:
        - createTable:
            tableName: credit
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: DOUBLE
              #                  constraints:
              #                    nullable: false
              - column:
                  name: term
                  type: int
              #                  constraints:
              #                    nullable: false
              - column:
                  name: interest
                  type: DOUBLE
#                  constraints:
              #                    nullable: false
              #                    unique: true
              - column:
                  name: monthly_payment
                  type: double
              #                  constraints:
              #                    nullable: false
              - column:
                  name: requested_amount
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: check_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
              #                  constraints:
              #                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
#                    updatable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP